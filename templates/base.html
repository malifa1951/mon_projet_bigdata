<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>BD4TVShow</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="/">📺 BD4TVShow</a>
        <div>
            <a class="btn btn-outline-light btn-sm" href="/">Accueil</a>
            <a class="btn btn-outline-light btn-sm" href="/add">Ajouter</a>
            <a class="btn btn-outline-light btn-sm" href="/stats">Statistiques</a>
            <a class="btn btn-outline-light btn-sm" href="/export">Export CSV</a>
        </div>
    </div>
</nav>
<div class="container">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}
        <div class="alert alert-{{ cat }}">{{ msg }}</div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
</div>
</body>
</html>
