{% extends 'base.html' %}
{% block content %}
<h2>{{ 'Modifier' if serie else 'Ajouter' }} une série</h2>
<form method="post">
    <div class="mb-3">
        <label>Titre</label>
        <input type="text" name="titre" class="form-control" value="{{ serie.titre if serie else '' }}" required>
    </div>
    <div class="mb-3">
        <label>Année début</label>
        <input type="number" name="annee_debut" class="form-control" value="{{ serie.annee_debut if serie else '' }}">
    </div>
    <div class="mb-3">
        <label>Année fin</label>
        <input type="number" name="annee_fin" class="form-control" value="{{ serie.annee_fin if serie else '' }}">
    </div>
    <div class="mb-3">
        <label>Note</label>
        <input type="number" step="0.1" name="note" class="form-control" value="{{ serie.note if serie else '' }}">
    </div>
    <div class="mb-3">
        <label>Genre</label>
        <select name="genre_id" class="form-select">
            <option value="">-- Choisir --</option>
            {% for g in genres %}
            <option value="{{ g.id }}" {% if serie and serie.genre_id == g.id %}selected{% endif %}>{{ g.nom }}</option>
            {% endfor %}
        </select>
    </div>
    <button class="btn btn-success">Enregistrer</button>
    <a href="/" class="btn btn-secondary">Annuler</a>
</form>
{% endblock %}
